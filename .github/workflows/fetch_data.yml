name: Fetch data on schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  fetch_air:
    name: Fetch and pre-process air data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      # Install uv
      - name: Install uv
        run: pipx install uv

      # Setup DVC (IMPORTANT - missing in your old workflow)
      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # 🔑 CONNECT TO DAGSHUB REMOTE + PULL EXISTING DATA
      - name: DVC pull data
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc pull || true

      # Run your pipeline scripts
      - name: Run fetch script
        run: uv run python src/fetch_air_data.py 

      - name: Run pre-process script
        run: uv run python src/preprocess_air_data.py

      # 📦 TRACK + PUSH DATA WITH DVC (NOT git add data)
      - name: Commit data changes
        run: |
          dvc add src/data
          dvc push

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add src/data.dvc .gitignore

          git commit -m "Updated air data on $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"

      - name: Push changes
        run: git push --force